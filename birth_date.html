<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تاریخ تولد</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        input {
            font-size: 18px;
            padding: 10px;
            width: 100%;
        }
        button {
            margin-top: 20px;
            padding: 12px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h3>📅 تاریخ تولد را انتخاب کنید</h3>

<input type="date" id="birth_date">

<button onclick="submitDate()">ثبت تاریخ</button>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function submitDate() {
        const date = document.getElementById("birth_date").value;

        if (!date) {
            alert("لطفاً تاریخ را انتخاب کنید");
            return;
        }

        tg.sendData(JSON.stringify({
            field: "birth_date",
            value: date
        }));
    }
</script>

</body>
</html>
